<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Digit Chip card</title>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; background: #e7ebef; color: #141a22; font-family: "Schibsted Grotesk", sans-serif; display: grid; grid-template-columns: 1fr 470px; align-items: center; gap: 56px; padding: 0 64px; box-sizing: border-box; }
  h1 { font-size: 78px; line-height: .97; letter-spacing: -0.035em; margin: 0 0 26px; font-weight: 800; }
  p { font-size: 26px; color: #4a5462; margin: 0; font-weight: 500; line-height: 1.3; }
  .dev { background: #16191e; border-radius: 26px; padding: 26px; display: grid; grid-template-columns: 230px 1fr; gap: 22px; box-shadow: 0 40px 70px -35px rgba(10,14,20,.6); }
  .px { display: grid; grid-template-columns: repeat(8, 1fr); gap: 0; background: #0d0f12; border-radius: 12px; overflow: hidden; aspect-ratio: 1; }
  .px i { background: #0d0f12; }
  .px i.on { background: #fff; }
  .pins { grid-column: 1; display: grid; grid-template-columns: repeat(8, 1fr); justify-items: center; margin-top: -8px; }
  .pins i { width: 13px; height: 13px; border-radius: 50%; background: #2a2f37; }
  .pins i.on { background: #ff3a2e; box-shadow: 0 0 12px rgba(255,58,46,.8); }
  .seg { grid-row: 1 / span 2; grid-column: 2; background: #0b0d10; border-radius: 14px; display: grid; place-items: center; padding: 18px; }
  .seg svg { width: 100%; }
  .s { fill: #2a1e1f; } .s.on { fill: #ff3a2e; filter: drop-shadow(0 0 8px rgba(255,58,46,.8)); }
</style>
</head>
<body>
  <div>
    <h1>Draw a digit. The chip answers in 8 clocks.</h1>
    <p>A digit classifier compiled into sky130 logic. 80 multiply accumulates per clock. Designed by an AI agent, verified on the free Tiny Tapeout flow.</p>
  </div>
  <div class="dev">
    <div class="px" id="px"></div>
    <div class="seg"><svg viewBox="0 0 120 200">
      <polygon class="s on" points="22,10 98,10 86,22 34,22"/>
      <polygon class="s on" points="100,14 100,94 88,86 88,26"/>
      <polygon class="s on" points="100,106 100,186 88,174 88,114"/>
      <polygon class="s" points="22,190 98,190 86,178 34,178"/>
      <polygon class="s" points="20,106 20,186 32,174 32,114"/>
      <polygon class="s" points="20,14 20,94 32,86 32,26"/>
      <polygon class="s" points="24,100 34,92 86,92 96,100 86,108 34,108"/>
    </svg></div>
    <div class="pins" id="pins"></div>
  </div>
<script>
  // test image 0 of the digits test split (label 7), 1 bit pixels, exactly as the chip receives it
  const rows = [0x38, 0x2C, 0x24, 0x30, 0x78, 0x10, 0x18, 0x08];
  const px = document.getElementById('px'), pins = document.getElementById('pins');
  rows.forEach(r => { for (let j = 0; j < 8; j++) { const i = document.createElement('i'); if ((r >> j) & 1) i.className = 'on'; px.appendChild(i); } });
  for (let j = 0; j < 8; j++) { const i = document.createElement('i'); if ((rows[4] >> j) & 1) i.className = 'on'; pins.appendChild(i); }
</script>
</body>
</html>
