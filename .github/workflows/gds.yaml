name: gds

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttsky26d
        with:
          pdk: sky130A

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttsky26d

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ttsky26d

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Same as TinyTapeout/tt-gds-action/viewer, but the site root is the interactive demo (demo/) instead of a redirect
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: tt_submission
      - uses: actions/download-artifact@v7
        with:
          name: gds_render
          path: gh-pages
      - name: Assemble site
        run: |
          cp tt_submission/*.gds gh-pages/tinytapeout.gds
          cp tt_submission/*.oas gh-pages/tinytapeout.oas
          cp demo/* gh-pages/
          PDK=$(jq -r '.PDK' tt_submission/pdk.json)
          sed -i "s/pdk=sky130A/pdk=$PDK/" gh-pages/index.html
          ls -la gh-pages
      - uses: actions/upload-pages-artifact@v5
        with:
          path: gh-pages
      - id: deployment
        uses: actions/deploy-pages@v5
